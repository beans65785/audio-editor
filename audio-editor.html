<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Editor - JS Expression to Audio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #e9ecef;
        }

        .panel h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
            font-size: 0.9em;
        }

        input[type="text"],
        input[type="number"],
        input[type="file"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: 'Courier New', monospace;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-bottom: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .button-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .button-tertiary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .output-panel {
            grid-column: 1 / -1;
        }

        .visualizer {
            width: 100%;
            height: 150px;
            background: #000;
            border-radius: 5px;
            margin-bottom: 15px;
            border: 2px solid #667eea;
        }

        #waveform {
            width: 100%;
            height: 100%;
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .info-box code {
            background: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            color: #d32f2f;
        }

        .samples {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .sample-btn {
            padding: 10px;
            font-size: 0.85em;
            background: #6c757d;
        }

        .sample-btn:hover {
            background: #5a6268;
        }

        .status {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .slider-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="range"] {
            flex: 1;
            cursor: pointer;
        }

        .slider-value {
            min-width: 50px;
            text-align: right;
            font-weight: 600;
            color: #667eea;
        }

        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
        }

        .tab-btn {
            padding: 10px 20px;
            background: transparent;
            color: #333;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: -2px;
            width: auto;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 Audio Editor</h1>
            <p>JavaScript Expression to Audio Generator with Bytebeat & WAV Export</p>
        </div>

        <div class="content">
            <!-- Expression Input Panel -->
            <div class="panel">
                <h2>Expression Input</h2>
                
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('expr-tab')">Expression</button>
                    <button class="tab-btn" onclick="switchTab('upload-tab')">Upload</button>
                </div>

                <div id="expr-tab" class="tab-content active">
                    <div class="form-group">
                        <label>JavaScript Expression (use t for time)</label>
                        <textarea id="expression" placeholder="Example: Math.sin(t * 2 * Math.PI) * 0.3">Math.sin(t * 440 * 2 * Math.PI) * 0.3</textarea>
                    </div>

                    <div class="info-box">
                        <strong>Tips:</strong><br>
                        • <code>t</code> = time (0 to 1)<br>
                        • <code>Math.sin()</code>, <code>Math.cos()</code>, etc.<br>
                        • Bytebeat: <code>(t >> 8) & (t << 2)</code><br>
                        • Keep amplitude between -1 and 1
                    </div>

                    <div class="samples">
                        <button class="sample-btn" onclick="loadSample('sine')">Sine Wave</button>
                        <button class="sample-btn" onclick="loadSample('square')">Square Wave</button>
                        <button class="sample-btn" onclick="loadSample('sawtooth')">Sawtooth</button>
                        <button class="sample-btn" onclick="loadSample('triangle')">Triangle</button>
                        <button class="sample-btn" onclick="loadSample('bytebeat1')">Bytebeat 1</button>
                        <button class="sample-btn" onclick="loadSample('bytebeat2')">Bytebeat 2</button>
                    </div>
                </div>

                <div id="upload-tab" class="tab-content">
                    <div class="form-group">
                        <label>Upload Audio File</label>
                        <input type="file" id="audioFile" accept="audio/*">
                    </div>
                    <button onclick="uploadAudio()">Load Audio</button>
                    <div id="uploadStatus" class="status"></div>
                </div>
            </div>

            <!-- Parameters Panel -->
            <div class="panel">
                <h2>Parameters</h2>

                <div class="form-group">
                    <label>Duration (seconds)</label>
                    <input type="number" id="duration" value="2" min="0.1" max="30" step="0.1">
                </div>

                <div class="form-group">
                    <label>Sample Rate (Hz)</label>
                    <select id="sampleRate">
                        <option value="8000">8000 (Low)</option>
                        <option value="16000">16000 (Medium)</option>
                        <option value="22050">22050 (Radio)</option>
                        <option value="44100" selected>44100 (CD)</option>
                        <option value="48000">48000 (Professional)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Master Volume</label>
                    <div class="slider-group">
                        <input type="range" id="volume" min="0" max="100" value="50" oninput="updateVolumeLabel()">
                        <span class="slider-value" id="volumeLabel">50%</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Pitch Shift</label>
                    <div class="slider-group">
                        <input type="range" id="pitchShift" min="-12" max="12" value="0" step="1" oninput="updatePitchLabel()">
                        <span class="slider-value" id="pitchLabel">0</span>
                    </div>
                </div>

                <button onclick="generateAudio()">Generate Audio</button>
                <button class="button-secondary" onclick="playAudio()">▶ Play</button>
                <button class="button-tertiary" onclick="stopAudio()">⏹ Stop</button>
            </div>

            <!-- Output & Visualization Panel -->
            <div class="panel output-panel">
                <h2>Output & Visualization</h2>

                <div id="status" class="status"></div>

                <canvas id="waveform" class="visualizer"></canvas>

                <div class="button-group">
                    <button onclick="downloadWAV()">📥 Download WAV</button>
                    <button class="button-secondary" onclick="downloadJSON()">📥 Export JSON</button>
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label>Audio Info</label>
                    <textarea id="audioInfo" readonly>Duration: -- | Sample Rate: -- | Samples: -- | Size: --</textarea>
                </div>
            </div>
        </div>
    </div>

    <script src="audio-generator.js"></script>
    <script src="bytebeat.js"></script>
    <script src="wav-exporter.js"></script>
    <script src="samples.js"></script>
</body>
</html>
